apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-application-amit
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: nginx
            releaseName: my-nginx
            targetRevision: 18.1.2
          - chart: mysql
            releaseName: my-mysql
            targetRevision: 9.23.0
  template:
    metadata:
      name: '{{releaseName}}'
    spec:
      project: default
      source:
        repoURL: https://charts.bitnami.com/bitnami
        chart: '{{chart}}'
        targetRevision: '{{targetRevision}}'
        helm:
          releaseName: '{{releaseName}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: amit-default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
